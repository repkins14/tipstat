<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIPSTAT">
<title>TIPSTAT</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--navy:#0D1B2A;--navy2:#1B2B3C;--lime:#C5F04A;--bg:#EEF1F4;--card:#FFFFFF;--line:#DDE2E8;--line2:#EEF1F4;--txt:#111827;--txt2:#374151;--txt3:#4B5563;--head:#E6EDF5;--green:#166534;--greenbg:#DCF5DC;--red:#B91C1C;--redbg:#FDE2E2;--blue:#1E3A5F;--bluebg:#DCE8F7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 10px;position:sticky;top:0;z-index:5;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.title{font-size:22px;font-weight:800}
.sub{font-size:12px;color:#B8C4D0;font-weight:600}
.back{width:44px;height:44px;border-radius:10px;background:var(--navy2);display:flex;align-items:center;justify-content:center;border:none;color:#fff;flex-shrink:0}
.seg{display:flex;gap:4px;background:var(--navy2);padding:4px;border-radius:10px;overflow-x:auto}
.seg button{flex:1 0 auto;height:36px;padding:0 10px;border:none;border-radius:7px;background:transparent;color:#B8C4D0;font-weight:800;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--lime);color:var(--navy)}
.seg.light{background:#fff;border:1px solid var(--line)}
.seg.light button{color:var(--txt2);font-weight:700}
.seg.light button.on{background:var(--navy);color:#fff}
.tabs{display:flex;overflow-x:auto;margin:0 -12px -10px;padding:0 4px}
.tabs button{flex-shrink:0;height:44px;border:none;background:transparent;color:#B8C4D0;font-weight:800;font-size:12px;text-transform:uppercase;padding:0 12px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--lime);border-bottom-color:var(--lime)}
.main{flex:1;padding:12px 12px 150px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pad{padding:12px}
.h{font-size:13px;font-weight:800;text-transform:uppercase;color:#1F2A37;padding-top:6px}
.chead{padding:9px 12px;background:var(--head);font-size:12px;font-weight:800;text-transform:uppercase;color:#1F2A37;display:flex;justify-content:space-between;align-items:center;gap:8px}
.m{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 12px;border-top:1px solid var(--line2);min-height:58px}
.m:first-child{border-top:none}
.mt{width:44px;font-size:12px;font-weight:700;color:var(--txt2);flex-shrink:0;text-align:center}
.mb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tn{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small{font-size:12px;color:var(--txt3)}
.tiny{font-size:11px;color:var(--txt3)}
.chip{min-width:48px;height:26px;padding:0 6px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.c-hi{background:var(--lime);color:var(--navy)}.c-mid{background:var(--bluebg);color:var(--blue)}.c-lo{background:var(--line2);color:var(--txt2)}
.c-ok{background:var(--greenbg);color:var(--green)}.c-no{background:var(--redbg);color:var(--red)}
.add{min-width:50px;height:44px;padding:0 6px;white-space:nowrap;border-radius:8px;border:1px solid #C3CCD6;background:#fff;color:var(--navy);font-weight:800;font-size:12px;flex-shrink:0}
.add.on{background:var(--navy);color:var(--lime);border-color:var(--navy)}
.btn{height:46px;border-radius:10px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:800;padding:0 14px}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--navy)}
.btn.dark{background:var(--navy);color:#fff}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap}
.chips button{flex-shrink:0;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--txt2);font-weight:700;font-size:13px}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips button.off{color:#9AA3AF;text-decoration:line-through;border-style:dashed}
.tip{padding:12px;display:flex;flex-direction:column;gap:9px}
.rank{width:32px;height:32px;border-radius:9px;background:var(--navy);color:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.note{padding:9px 10px;border-radius:8px;background:#F3F6F9;font-size:12px;line-height:1.45;color:#1F2A37}
.warn{padding:9px 10px;border-radius:8px;background:#FFF4E5;border:1px solid #F5C77E;font-size:12px;line-height:1.45;color:#5C3A00}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.scale{padding:10px 12px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:5px}
.track{height:6px;border-radius:3px;background:var(--line2);display:flex}
.form{display:flex;gap:4px;flex-wrap:wrap}
.fl{width:30px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fl b{width:30px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px}
.V{background:var(--greenbg);color:var(--green)}.R{background:var(--bluebg);color:var(--blue)}.P{background:var(--redbg);color:var(--red)}
.line{display:flex;align-items:center;gap:10px}
.step{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:#F3F6F9;font-size:24px;font-weight:800;color:var(--navy)}
.ticketbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:496px;height:56px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 6px 20px rgba(13,27,42,.3);z-index:6}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:7}
.nav a{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:#6B7280;position:relative}
.nav a.on{color:var(--navy)}
.badge{position:absolute;top:6px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--lime);color:var(--navy);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:18px}
.empty{padding:28px 16px;text-align:center;color:var(--txt3);font-size:14px;line-height:1.5}
.banner{padding:10px 12px;border-radius:10px;background:#FFF4E5;border:1px solid #F5C77E;color:#5C3A00;font-size:12px;font-weight:600;line-height:1.4}
input.inp{height:44px;border-radius:10px;border:1px solid var(--line);padding:0 12px;width:100%;background:#fff}
.search{height:40px;border-radius:10px;border:none;padding:0 12px;width:100%;background:var(--navy2);color:#fff}
.search::placeholder{color:#8FA0B3}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--navy);color:var(--lime);font-weight:800;padding:12px 16px;border-radius:12px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px}
</style>
</head>
<body>
<div id="app"><div class="empty">Načítavam…</div></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
</body>
</html>
