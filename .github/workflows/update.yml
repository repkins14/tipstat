name: Aktualizacia dat

on:
  schedule:
    - cron: '0 5,11,16,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalacia
        run: pip install -r pipeline/requirements.txt
      - name: Stiahnutie a vypocet dat
        run: python pipeline/update.py
      - name: Ulozenie dat
        run: |
          git config user.name "tipstat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data pipeline
          git commit -m "Aktualizacia dat" || echo "Bez zmien"
          git push
